<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Theme</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; }
    </style>
  </head>
  <body>
    <!--
      The one thing Python cannot do by itself: read localStorage.

      The app document has a script that paints the right mode before this frame
      even loads, but Python has no way to know what that mode was, so the switch
      in the nav row would show the default on a device that had been set to day.
      This frame reports the stored preference back on its first render, which is
      what lets Python seed the control. After that it mirrors whatever Python
      sends, so a press on the control is the authority for both documents.

      It talks the same protocol as the board frame, which is why there is no
      build step: a component is a page that posts messages.
    -->
    <script>
      (function () {
        var KEY = "family-task-theme";
        var PREFERENCES = ["day", "night", "auto"];
        var DEFAULT = "night";
        var DAY_FROM = 7;
        var DAY_TO = 19;

        var greeted = false;
        var lastSent = null;

        function read() {
          try {
            var value = window.localStorage.getItem(KEY);
            return PREFERENCES.indexOf(value) === -1 ? DEFAULT : value;
          } catch (e) {
            /* Private browsing, or storage turned off: a screen that cannot
               remember a choice can still be given one from Python. */
            return DEFAULT;
          }
        }

        function write(preference) {
          try {
            window.localStorage.setItem(KEY, preference);
          } catch (e) { /* still applies for this page view */ }
        }

        function resolve(preference) {
          if (preference !== "auto") return preference;
          var hour = new Date().getHours();
          return hour >= DAY_FROM && hour < DAY_TO ? "day" : "night";
        }

        /* Same-origin, so the app document is reachable. This is what lets a
           report from this frame repaint the page it is embedded in. */
        function hostDocument() {
          try {
            return window.parent.document;
          } catch (e) {
            return null;
          }
        }

        function paint(preference) {
          var doc = hostDocument();
          if (!doc) return;
          var next = resolve(preference);
          if (doc.documentElement.getAttribute("data-mode") !== next) {
            doc.documentElement.setAttribute("data-mode", next);
          }
        }

        function post(message) {
          window.parent.postMessage(
            Object.assign({ isStreamlitMessage: true }, message),
            "*"
          );
        }

        function report(preference) {
          if (preference === lastSent) return;
          lastSent = preference;
          post({
            type: "streamlit:setComponentValue",
            value: preference,
            dataType: "json",
          });
        }

        window.addEventListener("message", function (event) {
          if (!event.data || event.data.type !== "streamlit:render") return;
          var given = event.data.args && event.data.args.preference;

          if (!greeted) {
            /* The first render carries Python's default, because Python cannot
               have read storage yet. Obeying it would overwrite the device's
               saved choice with the default on every load. This frame's job on
               the first render is to hand Python the stored value instead. */
            greeted = true;
            var stored = read();
            paint(stored);
            report(stored);
            return;
          }

          if (PREFERENCES.indexOf(given) === -1) given = read();
          write(given);
          paint(given);
        });

        /* Painted before the handshake too, so the very first frame this frame
           can influence is already the right mode even if messaging is slow. */
        paint(read());

        /* Ready first: Streamlit drops a setComponentValue that arrives before
           the handshake, the same way it drops a setFrameHeight. */
        post({ type: "streamlit:componentReady", apiVersion: 1 });
      })();
    </script>
  </body>
</html>
