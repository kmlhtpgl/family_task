<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; }
    button {
      width: 100%; min-height: 42px; padding: 0 14px; border: 1px solid #00aeda;
      border-radius: 10px; background: #00c7ff; color: #071018; cursor: pointer;
      font: 650 13px/1 system-ui, sans-serif;
    }
    button:active { transform: translateY(1px); }
    #status { margin-top: 6px; color: #9ba7b7; font: 11px/1.2 system-ui, sans-serif; text-align: center; }
  </style>
</head>
<body>
  <button id="test" type="button"></button>
  <div id="status"></div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var mode = params.get('mode') || 'screensaver';
      var prayer = params.get('prayer') || 'Fajr';
      var button = document.getElementById('test');
      var status = document.getElementById('status');
      button.textContent = mode === 'adhan' ? 'Play test adhan · ' + prayer : 'Preview screensaver';
      button.addEventListener('click', function () {
        var runtime = window.parent;
        if (mode === 'adhan' && runtime.Adhan) {
          runtime.Adhan.play(prayer);
          status.textContent = 'Sending audio to the kiosk runtime';
        } else if (mode !== 'adhan' && runtime.Kiosk) {
          runtime.Kiosk.screensaver();
          status.textContent = 'Screensaver requested';
        } else {
          status.textContent = 'Kiosk runtime is not loaded yet';
        }
      });
    })();
  </script>
</body>
</html>
